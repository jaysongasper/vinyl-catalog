<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Jayson’s Vinyl Collection</title><link rel="stylesheet" href="/styles.css"></head>
<body>
  <header class="site-header"><div class="header-inner"><div><div class="eyebrow">PERSONAL ARCHIVE</div><h1>Jayson’s Vinyl Collection</h1><p id="summary">Loading collection…</p></div><div class="header-actions"><button id="loginBtn" class="secondary">Admin Login</button><button id="add" class="primary admin-only">＋ Add record</button></div></div></header>
  <section class="tools"><div class="tools-inner"><input id="search" aria-label="Search collection" placeholder="Search artist, album, genre, notes…" autocomplete="off"><div class="genre-controls"><div id="genres" class="chips"></div><button type="button" id="genreToggle" class="genre-toggle" aria-label="Expand genre filters" aria-expanded="false">+</button></div></div></section>
  <div id="adminBar" class="admin-bar admin-only"><span>Admin mode — edit records in List view</span><div><button id="artworkManager" class="secondary">Cover artwork</button><button id="exportCsv" class="secondary">Export CSV</button><button id="cancelChanges" class="secondary">Cancel</button><button id="saveChanges" class="primary">Save changes</button><button id="logoutBtn" class="secondary">Log out</button></div></div>
  <div class="meta"><div class="count-view"><span id="count">Loading…</span><div class="view-toggle" role="group" aria-label="Collection view"><button id="listView" class="active" aria-pressed="true">List</button><button id="tileView" aria-pressed="false">Tile</button></div></div><label>Sort <select id="sort"><option value="artist">Artist A–Z</option><option value="album">Album A–Z</option><option value="new">Year: newest</option><option value="old">Year: oldest</option></select></label></div>
  <main><div id="listPanel" class="table-wrap"><table class="collection-table"><thead><tr><th>Artist</th><th>Album</th><th>Year</th><th>Genre</th><th>Notes</th><th class="admin-col">Artist Type</th><th class="admin-col">Delete</th></tr></thead><tbody id="tableBody"></tbody></table></div><div id="tilePanel" class="tile-grid" hidden></div></main>
  <div id="modal" class="modal" aria-hidden="true"><form id="form" class="sheet"><div class="head"><h2 id="title">Admin Login</h2><button type="button" id="close" class="close" aria-label="Close">×</button></div><div id="loginFields"><label>Username</label><input id="username" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><div id="loginError" class="login-error" role="alert"></div><button class="save" type="submit">Log in</button></div><div id="recordFields" class="record-fields"><input type="hidden" id="id"><label>Artist</label><input id="artist" required><label>Artist Type</label><select id="artistType"><option value="Group/Artist">Group/Artist</option><option value="Person">Person</option></select><label>Album</label><input id="album" required><label>Year</label><input id="year" type="number" min="1000" max="2100"><label>Genre</label><input id="genre"><label>Notes</label><textarea id="notes"></textarea><div class="actions"><button type="button" id="del" class="delete">Delete</button><button class="save">Save record</button></div></div></form></div>
  <div id="drawer" class="drawer" aria-hidden="true"><section><div class="drawer-head"><div><div class="eyebrow">ADMIN</div><h2>Cover artwork</h2></div><button id="drawerClose" class="close" aria-label="Close">×</button></div><div class="drawer-actions"><button id="backfillArtwork" class="primary">Backfill missing covers</button><button id="reloadArtwork" class="secondary">Refresh status</button></div><p id="artworkSummary"></p><div id="artworkRows" class="artwork-rows"></div></section></div>
  <script src="/app.js"></script>
</body></html>
